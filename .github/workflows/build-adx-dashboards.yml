name: Build ADX dashboard files

on:
  push:
    branches:
      - main
    paths:
      - "source/adx/**/*.json"
      - "mapping.json"
      - "scripts/**"
      - ".github/workflows/build-adx-dashboards.yml"
  pull_request:
    paths:
      - "source/adx/**/*.json"
      - "mapping.json"
      - "scripts/**"
      - ".github/workflows/build-adx-dashboards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build dist and query files
        run: python scripts/build_dist.py

      - name: Validate source, dist, and KQL
        run: python scripts/validate_adx_dashboard.py source/adx dist

      - name: Commit generated files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ queries/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update generated ADX dashboard files"
            git push
          fi
