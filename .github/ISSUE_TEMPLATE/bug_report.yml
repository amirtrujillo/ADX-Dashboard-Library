name: Bug report
description: Report an ADX dashboard, KQL, import, filter, or interaction issue
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private hostnames, customer data, and personal data before submitting.
  - type: input
    id: dashboard
    attributes:
      label: Dashboard
      placeholder: Machine Health
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.4.0
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: Describe the observed behavior and any error messages.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
